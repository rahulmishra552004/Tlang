<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tlang</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <h1>Tlang<span class="brand-dot" aria-hidden="true">.</span></h1>
        <span class="platform">for YouTube</span>
      </header>

      <section class="control-row" aria-labelledby="dubbing-title">
        <div class="control-copy">
          <h2 id="dubbing-title">Voice dubbing</h2>
          <p>Let the captions speak.</p>
        </div>
        <label class="switch">
          <input type="checkbox" role="switch" aria-label="Enable voice dubbing" checked>
          <span class="switch-track" aria-hidden="true">
            <span class="switch-thumb"></span>
          </span>
        </label>
      </section>
      <section class="voice-settings" aria-label="Voice settings">
        <div class="voice-control">
          <label for="language-select">Language</label>
          <select id="language-select">
            <option value="en" selected>English</option>
            <option value="hi">Hindi</option>
            <option value="ja">Japanese</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="ko">Korean</option>
            <option value="pt">Portuguese</option>
          </select>
        </div>
        <div class="voice-control">
          <label for="voice-select">Voice</label>
          <select id="voice-select">
            <option value="">Default voice</option>
          </select>
        </div>
        <div class="slider-control">
          <label for="volume-slider">Volume</label>
          <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="1">
          <div class="slider-scale" aria-hidden="true"><span>Quiet</span><span>Loud</span></div>
        </div>
        <div class="slider-control">
          <label for="pitch-slider">Pitch</label>
          <input id="pitch-slider" type="range" min="0" max="2" step="0.1" value="1">
          <div class="slider-scale" aria-hidden="true"><span>Low</span><span>High</span></div>
        </div>
      </section>
    </main>
    <script src='popup.js'></script>
  </body>
</html>
